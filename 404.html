<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
name="description"
content="Cameron Chamberlain — Page not found."

>

  <title>404 | Cameron Chamberlain</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .error-content {
      max-width: 650px;
    }

    .error-code {
      font-size: clamp(7rem, 20vw, 12rem);
      line-height: 0.85;
      font-weight: 800;
      letter-spacing: -0.08em;
      margin: 0 0 30px;
      color: var(--text);
    }

    .error-code span {
      color: var(--accent);
    }

    .error-content h1 {
      margin-bottom: 16px;
    }

    .error-content p {
      max-width: 500px;
      margin: 0 auto 30px;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .error-terminal {
      margin: 0 auto 35px;
      max-width: 420px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      text-align: left;
      font-family: monospace;
      font-size: 0.9rem;
    }

    .error-terminal .prompt {
      color: var(--accent);
    }

    .error-terminal .output {
      opacity: 0.7;
      margin-top: 6px;
    }
  </style>

</head>

<body>

  <main class="error-page">
    <div class="error-content">

  <div class="error-code">
    <span>404</span>
  </div>

  <p>
    The page you're looking for doesn't exist or moved somewhere else.
  </p>

  <div class="error-actions">
    <a class="button primary" href="./">
      Back to portfolio
    </a>

  </div>

</div>

</main>

</body>
</html>
